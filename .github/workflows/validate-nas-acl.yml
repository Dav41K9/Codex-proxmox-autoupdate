name: Validate NAS ACL hotfix
on:
  push:
    branches: [fix/nas-acl-20261104]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bash syntax
        run: find proxmox-maintenance scripts -type f -name '*.sh' -exec bash -n {} +
      - name: Python syntax
        run: python3 -m compileall -q proxmox-maintenance tests fixes
      - name: Offline regression tests
        run: sudo python3 -m unittest discover -s tests -v
